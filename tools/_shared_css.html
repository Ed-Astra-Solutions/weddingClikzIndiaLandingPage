    <style>
        :root {
            --gold: #C9A87C;
            --gold-light: #E8D5B7;
            --gold-dark: #8B7355;
            --cream: #FAF7F2;
            --charcoal: #2C2C2C;
            --charcoal-light: #3D3D3D;
            --white: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-light: #6B6B6B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: 0.02em; }
        em { font-style: italic; color: var(--gold-dark); }
        a { color: inherit; }
        img { max-width: 100%; display: block; }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(44, 44, 44, 0.95); backdrop-filter: blur(10px);
            padding: 1rem 0; transition: all 0.3s ease;
        }
        header.scrolled { padding: 0.5rem 0; box-shadow: 0 4px 30px rgba(0,0,0,0.2); }
        .header-container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .logo-img { height: 46px; width: auto; }
        .logo .logo-text { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.5rem; color: var(--white); letter-spacing: 0.02em; }
        .logo .logo-text span { color: var(--gold); }
        nav ul { display: flex; list-style: none; gap: 2.25rem; }
        nav a {
            text-decoration: none; color: var(--white); font-size: 0.8rem; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase; position: relative; padding: 0.5rem 0; transition: color 0.3s;
        }
        nav a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--gold); transition: width 0.3s; }
        nav a:hover { color: var(--gold); }
        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a.active { color: var(--gold); }
        .nav-cta {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.4rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--white);
            text-decoration: none; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em;
            text-transform: uppercase; border-radius: 50px; transition: all 0.3s;
        }
        .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,124,0.35); }
        .mobile-menu-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
        .mobile-menu-toggle span { width: 26px; height: 2px; background: var(--white); transition: all 0.3s; }

        /* Hero */
        .hero {
            min-height: 92vh; display: flex; align-items: center; justify-content: center; text-align: center;
            position: relative; overflow: hidden; color: var(--white); padding: 8rem 1.5rem 4rem;
            background: linear-gradient(rgba(26,26,26,0.55), rgba(26,26,26,0.75)),
                        url('assets/gallery/wedding-photography-dubai-hero.jpg') center/cover;
        }
        .hero-inner { max-width: 860px; z-index: 1; }
        .eyebrow {
            display: inline-block; padding: 0.5rem 1.5rem; background: rgba(201,168,124,0.18);
            border: 1px solid var(--gold); color: var(--gold-light); font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase;
            border-radius: 50px; margin-bottom: 1.75rem;
        }
        .hero h1 { font-size: clamp(2.6rem, 6.5vw, 5rem); line-height: 1.05; margin-bottom: 1.5rem; }
        .hero h1 em { color: var(--gold); }
        .hero p { font-size: clamp(1rem, 2vw, 1.2rem); color: rgba(255,255,255,0.9); font-weight: 300; max-width: 640px; margin: 0 auto 2.5rem; }
        .hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.6rem; padding: 1rem 2.4rem; border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
            text-decoration: none; transition: all 0.3s; cursor: pointer; border: none;
        }
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--white); box-shadow: 0 10px 40px rgba(201,168,124,0.3); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(201,168,124,0.45); }
        .btn-outline { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.6); }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        .trust-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem;
            margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.15);
        }
        .trust-item { text-align: center; }
        .trust-item .num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--gold); font-weight: 600; }
        .trust-item .lbl { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.7); }

        /* Breadcrumb */
        .breadcrumb { background: var(--charcoal); padding: 0.9rem 0; }
        .breadcrumb ol { max-width: 1200px; margin: 0 auto; padding: 0 2rem; list-style: none; display: flex; gap: 0.5rem; font-size: 0.75rem; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); flex-wrap: wrap; }
        .breadcrumb a { color: var(--gold-light); text-decoration: none; }
        .breadcrumb a:hover { color: var(--gold); }

        /* Sections */
        section.block { padding: 5rem 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .section-head { text-align: center; max-width: 720px; margin: 0 auto 3rem; }
        .section-label { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 0.85rem; }
        .section-title { font-size: clamp(2rem, 4vw, 3rem); color: var(--charcoal); line-height: 1.15; margin-bottom: 1rem; }
        .section-sub { font-size: 1.02rem; color: var(--text-light); }

        /* Intro split */
        .intro { background: var(--white); }
        .intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
        .intro-copy .section-title { text-align: left; }
        .intro-copy p { color: var(--text-light); margin-bottom: 1.1rem; }
        .intro-media { position: relative; }
        .intro-media img { border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.15); aspect-ratio: 4/5; object-fit: cover; width: 100%; }
        .intro-media .badge {
            position: absolute; bottom: -22px; left: -22px; background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white); padding: 1.25rem 1.75rem; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .intro-media .badge .num { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 700; line-height: 1; }
        .intro-media .badge .lbl { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }

        /* Traditions grid */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.75rem; }
        .trad-card {
            background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            transition: all 0.35s; border: 1px solid rgba(201,168,124,0.12);
        }
        .trad-card:hover { transform: translateY(-8px); box-shadow: 0 22px 55px rgba(0,0,0,0.12); }
        .trad-card .img-wrap { aspect-ratio: 3/2; overflow: hidden; }
        .trad-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .trad-card:hover img { transform: scale(1.06); }
        .trad-card .body { padding: 1.5rem 1.6rem 1.8rem; }
        .trad-card h3 { font-size: 1.4rem; color: var(--charcoal); margin-bottom: 0.5rem; }
        .trad-card p { font-size: 0.9rem; color: var(--text-light); }

        /* Included / features */
        .features { background: var(--charcoal); color: var(--white); }
        .features .section-title { color: var(--white); }
        .features .section-sub { color: rgba(255,255,255,0.7); }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
        .feature-item { padding: 2rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,124,0.2); border-radius: 14px; transition: all 0.3s; }
        .feature-item:hover { background: rgba(201,168,124,0.08); border-color: var(--gold); }
        .feature-item .ico { width: 48px; height: 48px; border-radius: 12px; background: rgba(201,168,124,0.15); display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem; }
        .feature-item .ico svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.6; }
        .feature-item h3 { font-size: 1.3rem; color: var(--gold-light); margin-bottom: 0.5rem; }
        .feature-item p { font-size: 0.88rem; color: rgba(255,255,255,0.65); }

        /* Gallery */
        .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; }
        .gallery-grid a { border-radius: 12px; overflow: hidden; aspect-ratio: 1; display: block; }
        .gallery-grid img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .gallery-grid a:hover img { transform: scale(1.08); }
        .gallery-grid a.tall { grid-row: span 2; aspect-ratio: 1/2; }

        /* Venues */
        .venues { background: var(--white); }
        .venue-list { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        .venue-tag {
            padding: 0.7rem 1.4rem; background: var(--cream); border: 1px solid var(--gold-light); border-radius: 50px;
            font-size: 0.85rem; color: var(--charcoal); transition: all 0.3s;
        }
        .venue-tag:hover { background: var(--gold); color: var(--white); border-color: var(--gold); }

        /* Process */
        .process { background: var(--cream); }
        .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; counter-reset: step; }
        .step { text-align: center; position: relative; }
        .step .n {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1.25rem;
            background: var(--white); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
            font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold-dark);
        }
        .step h3 { font-size: 1.35rem; color: var(--charcoal); margin-bottom: 0.5rem; }
        .step p { font-size: 0.88rem; color: var(--text-light); }

        /* FAQ */
        .faq { background: var(--white); }
        .faq-list { max-width: 820px; margin: 0 auto; }
        .faq-item { border-bottom: 1px solid rgba(201,168,124,0.25); }
        .faq-item summary {
            list-style: none; cursor: pointer; padding: 1.4rem 0; display: flex; justify-content: space-between;
            align-items: center; gap: 1rem; font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; color: var(--charcoal);
        }
        .faq-item summary::-webkit-details-marker { display: none; }
        .faq-icon { color: var(--gold); font-size: 1.6rem; transition: transform 0.3s; flex-shrink: 0; }
        .faq-item[open] .faq-icon { transform: rotate(45deg); }
        .faq-answer { padding: 0 0 1.4rem; color: var(--text-light); font-size: 0.95rem; }

        /* CTA banner */
        .cta-banner {
            background: linear-gradient(rgba(26,26,26,0.82), rgba(26,26,26,0.88)),
                        url('assets/gallery/wedding-photography-uae-banner.jpg') center/cover;
            color: var(--white); text-align: center; padding: 6rem 1.5rem;
        }
        .cta-banner h2 { font-size: clamp(2rem, 4.5vw, 3.2rem); margin-bottom: 1rem; }
        .cta-banner h2 em { color: var(--gold); }
        .cta-banner p { color: rgba(255,255,255,0.85); max-width: 560px; margin: 0 auto 2.5rem; }

        /* Footer */
        footer { background: #1a1a1a; color: rgba(255,255,255,0.7); padding: 4rem 0 0; }
        .footer-grid { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 3rem; }
        .footer-brand h3 { font-size: 1.6rem; color: var(--white); margin-bottom: 1rem; }
        .footer-brand h3 span { color: var(--gold); }
        .footer-brand p { font-size: 0.9rem; margin-bottom: 1.25rem; max-width: 360px; }
        .footer-contact a { display: flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; margin-bottom: 0.5rem; transition: color 0.3s; }
        .footer-contact a:hover { color: var(--gold); }
        .footer-contact svg { stroke: var(--gold); flex-shrink: 0; }
        .footer-links h4 { color: var(--white); font-size: 1.2rem; margin-bottom: 1rem; }
        .footer-links ul { list-style: none; }
        .footer-links li { margin-bottom: 0.6rem; }
        .footer-links a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 0.88rem; transition: color 0.3s; }
        .footer-links a:hover { color: var(--gold); }
        .footer-bottom { max-width: 1200px; margin: 3rem auto 0; padding: 1.5rem 2rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 0.78rem; }
        .footer-bottom a { color: rgba(255,255,255,0.55); text-decoration: none; margin-left: 1rem; }
        .footer-bottom a:hover { color: var(--gold); }

        /* SEO city strip */
        .city-strip { background: #141414; padding: 2rem 0; }
        .city-strip h2 { font-size: 1.05rem; font-weight: 400; color: var(--gold); text-align: center; letter-spacing: 0.06em; margin-bottom: 1rem; }
        .city-strip p { max-width: 950px; margin: 0 auto; padding: 0 2rem; text-align: center; font-size: 0.72rem; color: #666; line-height: 2; }
        .city-strip a { color: #888; text-decoration: none; }
        .city-strip a:hover { color: var(--gold); }

        @media (max-width: 900px) {
            .intro-grid { grid-template-columns: 1fr; gap: 3rem; }
            .intro-copy .section-title, .intro-copy { text-align: center; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .gallery-grid a.tall { grid-row: span 1; aspect-ratio: 1; }
            .steps { grid-template-columns: repeat(2, 1fr); }
            .footer-grid { grid-template-columns: 1fr; gap: 2rem; }
        }
        @media (max-width: 768px) {
            .steps { grid-template-columns: 1fr; }
        }
    </style>
    <!-- Page-specific additions: prominent portfolio gallery + lightbox -->
    <style>
        /* Region switcher pill in the header */
        .region-switch { display: flex; align-items: center; gap: 0.35rem; margin-right: 1rem; }
        .region-switch a {
            display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.85rem;
            border: 1px solid rgba(201,168,124,0.55); border-radius: 999px; text-decoration: none;
            color: rgba(255,255,255,0.75); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
            transition: all 0.3s;
        }
        .region-switch a.current { background: var(--gold); border-color: var(--gold); color: var(--charcoal); font-weight: 600; }
        .region-switch a:hover:not(.current) { color: var(--gold); border-color: var(--gold); }

        /* Portfolio gallery — deliberately large and front-and-centre */
        .portfolio { background: var(--charcoal); color: var(--white); }
        .portfolio .section-title { color: var(--white); }
        .portfolio .section-sub { color: rgba(255,255,255,0.7); }
        .portfolio-grid {
            column-count: 3; column-gap: 1rem; max-width: 1200px; margin: 0 auto;
        }
        .portfolio-grid figure {
            break-inside: avoid; margin: 0 0 1rem; position: relative; border-radius: 12px;
            overflow: hidden; cursor: zoom-in; background: #222;
        }
        .portfolio-grid img { width: 100%; height: auto; display: block; transition: transform 0.6s ease; }
        .portfolio-grid figure:hover img { transform: scale(1.05); }
        .portfolio-grid figcaption {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem 1rem 0.9rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--gold-light); opacity: 0; transition: opacity 0.35s ease;
        }
        .portfolio-grid figure:hover figcaption { opacity: 1; }
        @media (max-width: 992px) { .portfolio-grid { column-count: 2; column-gap: 0.75rem; } .portfolio-grid figure { margin-bottom: 0.75rem; } }
        @media (max-width: 520px) { .portfolio-grid { column-count: 2; column-gap: 0.5rem; } .portfolio-grid figure { margin-bottom: 0.5rem; } }

        /* Lightbox */
        .lb { position: fixed; inset: 0; background: rgba(10,10,10,0.96); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .lb.open { display: flex; }
        .lb img { max-width: 92vw; max-height: 86vh; border-radius: 8px; }
        .lb button {
            position: absolute; background: rgba(255,255,255,0.1); border: none; color: #fff; cursor: pointer;
            width: 48px; height: 48px; border-radius: 50%; font-size: 1.5rem; line-height: 1; transition: background 0.25s;
        }
        .lb button:hover { background: var(--gold); color: var(--charcoal); }
        .lb .lb-close { top: 1.25rem; right: 1.25rem; }
        .lb .lb-prev { left: 1.25rem; top: 50%; transform: translateY(-50%); }
        .lb .lb-next { right: 1.25rem; top: 50%; transform: translateY(-50%); }
        .lb .lb-count { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.65); font-size: 0.8rem; letter-spacing: 0.1em; }

        /* City link cards */
        .city-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.25rem; }
        .city-card {
            display: block; padding: 1.6rem 1.5rem; background: var(--white); border: 1px solid rgba(201,168,124,0.25);
            border-radius: 14px; text-decoration: none; transition: all 0.3s;
        }
        .city-card:hover { transform: translateY(-6px); box-shadow: 0 18px 44px rgba(0,0,0,0.1); border-color: var(--gold); }
        .city-card h3 { font-size: 1.3rem; color: var(--charcoal); margin-bottom: 0.4rem; }
        .city-card p { font-size: 0.85rem; color: var(--text-light); }

    </style>
    <style>
        /* ------------------------------------------------------------------
           Header density (QA pass)

           The bar carries the logo lockup, the nav, the region switch and the
           Get Quote CTA. With the old 768px collapse point everything had to
           fit into ~740px of usable width at 800px viewport, so the links
           wrapped and clipped. Two changes fix it: the nav now collapses into
           the burger at 992px (matching index.html), and 993-1250px drops the
           wordmark so the remaining links always have room.
           ------------------------------------------------------------------ */

        /* Hidden on the desktop bar, revealed inside the burger menu below. */
        .nav-mobile-only { display: none; }

        @media (min-width: 993px) and (max-width: 1250px) {
            .logo .logo-text { display: none; }
            nav a { font-size: 0.72rem; letter-spacing: 0.08em; }
            nav ul { gap: 1.5rem; }
        }

        @media (max-width: 992px) {
            nav ul { display: none; }
            .mobile-menu-toggle { display: flex; }
            nav.open ul {
                display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0;
                background: var(--charcoal); padding: 1.5rem 2rem; gap: 1.25rem;
            }
            nav.open .nav-mobile-only { display: list-item; }
            /* .region-switch collapses with the nav; India/UAE live in the
               mobile menu as .nav-mobile-only items from here down. */
            .region-switch { display: none; }
        }
    </style>
